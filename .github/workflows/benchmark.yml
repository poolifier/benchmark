name: Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  benchmark:
    if: github.repository == 'poolifier/benchmark'
    runs-on:
      group: default
      labels: [self-hosted, benchmark]
    env:
      BENCHER_PROJECT: poolifier-benchmark
      BENCHER_API_TOKEN: ${{ secrets.BENCHER_API_TOKEN }}
      BENCHER_ADAPTER: shell_hyperfine
      BENCHER_TESTBED: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          check-latest: true
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --ignore-scripts --frozen-lockfile
      - uses: bencherdev/bencher@24c333d7030390d2f3e130569386f4f1f8577113 # main
      - name: Run benchmark
        run: |
          bencher run \
          --branch main \
          --threshold-measure latency \
          --threshold-test t_test \
          --threshold-max-sample-size 64 \
          --threshold-upper-boundary 0.99 \
          --thresholds-reset \
          --file BENCH.json \
          --err \
          "./bench.sh"
